[theme]
base = "dark"
primaryColor = "#FF725E"
backgroundColor = "#071116"
secondaryBackgroundColor = "#10232A"
textColor = "#EAF5F2"
font = "serif"

[server]
headless = true
# CORS stays ON (the default): a page from another website must not be able to open a connection to this app.
enableXsrfProtection = true
maxUploadSize = 10  # MB; the channel-data parser accepts at most 5 MB
